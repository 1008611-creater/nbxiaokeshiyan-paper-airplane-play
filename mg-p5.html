          p.fill(C.paper); ink(3); poly([[side * 3, -3], [tx, ty - 2], [tx + side * 1, ty + 3], [side * 3, 6]]);
          p.stroke(C.white); p.strokeWeight(2); p.line(side * 8, 0, side * (3 + L * 0.85 * ca), L * 0.85 * sa - 0.5);
        }
        p.pop();
      }
      // 俯视的尖头飞镖（和游戏里同款剪影）：ang = 机头朝向（0 = 朝上），sx = 左右压扁（摇摆）
      function dart(x, y, ang, sx, k) {
        p.push(); p.translate(x, y); p.rotate(ang); p.scale((sx || 1) * (k === undefined ? 1 : k), k === undefined ? 1 : k);
        p.fill(C.paper); ink(2.6); poly([[0, -17], [11, 11], [0, 6], [-11, 11]]);
        p.stroke(C.shade); p.strokeWeight(2); p.line(0, -13, 0, 5);
        p.pop();
      }
      // 真飞机正面剪影：机身圆、两只长翅膀、两台发动机、竖尾翼。flash = 两只翅膀同时闪同一个颜色
      function jet(cx, cy, s, flash) {
        p.push(); p.translate(cx, cy); p.scale(s);
        p.fill(C.white); ink(3); p.rect(-5, -58, 10, 44, 4);
        p.rect(-46, -32, 92, 8, 4);
        var wc = flash ? C.yellow : C.white;
        p.fill(wc); poly([[-14, -2], [-128, -14], [-128, -7], [-14, 12]]); poly([[14, -2], [128, -14], [128, -7], [14, 12]]);
        p.fill('#c9d6ea'); p.circle(-58, 14, 22); p.circle(58, 14, 22);
        p.fill(C.ink); p.noStroke(); p.circle(-58, 14, 10); p.circle(58, 14, 10);
        p.fill(C.white); ink(3.5); p.circle(0, 0, 40);
        p.fill(C.blue); ink(2.2); p.rect(-11, -10, 9, 7, 3); p.rect(2, -10, 9, 7, 3);
        p.noStroke(); p.fill('#c9d6ea'); p.circle(0, 7, 10);
        p.pop();
      }

      /* ---------- 画板 ---------- */
      function board(b) { p.fill(C.cream); ink(3.5); p.rect(b.x, b.y, b.w, b.h, 14); }
      function refLine(b, y, k) {
        if (k <= 0) return;
        p.stroke(C.blue); p.strokeWeight(2.2); dash(true);
        p.line(b.x + 14, y, b.x + 14 + (b.w - 28) * k, y); dash(false);
      }
      // 正面那两拍：一边低 vs 一样高；liftK > 0 时翅膀下长出托力箭头（第 2 拍）
      function frontPair(beat, bt, slide) {
        var t1 = beat === 1 ? bt : 9, t2 = beat === 2 ? bt : beat > 2 ? 9 : 0;
        var sweep = eo((t1 - 0.45) / 0.6), grow = eo(t2 / 0.5), breath = Math.sin(now * 4) * 3 * grow;
        var cyL = BL.y + 84, cyR = BR.y + 84, L = 90;
        // 左：飞机的左翅膀压低 BENT；第 2 拍左短右长 → 机身向低的一边歪（物理里往低的那边滚转）
        var roll = -0.16 * eo(t2 / 0.9) + Math.sin(now * 3) * 0.03 * grow;
        var tipHi = tipOf(BR.x + BR.w / 2, cyR, L, 0, 1, 0)[1] - 1;
        p.push(); p.translate(-slide, 0);
        refLine(BL, tipHi, sweep);
        frontPlane(BL.x + BL.w / 2, cyL, L, BENT, 0, roll, grow > 0 ? [22 * grow, (52 + breath * 0.3) * grow] : null);
        if (sweep > 0.95 && grow === 0) { var lo = tipOf(BL.x + BL.w / 2, cyL, L, BENT, -1, 0); p.stroke(C.red); p.strokeWeight(2.5); p.line(lo[0], tipHi + 4, lo[0], lo[1] - 4); }
        p.pop(); p.push(); p.translate(slide, 0);
        refLine(BR, tipHi, sweep);
        frontPlane(BR.x + BR.w / 2, cyR, L, 0, 0, 0, grow > 0 ? [(44 + breath) * grow, (44 + breath) * grow] : null);
        p.pop();
      }
      // 俯视那一拍：下方出手、上方教室门。u = 这一拍的进度
      function room(b, sh) {
        var cx = b.x + b.w / 2, dw = 23;
        p.push(); p.translate(sh, 0);
        p.stroke('#9c937a'); p.strokeWeight(2); dash(true); p.line(b.x + 30, b.y + b.h - 14, b.x + b.w - 30, b.y + b.h - 14); dash(false);
        ink(6); p.line(b.x + 9, b.y + 30, b.x + 9, b.y + b.h - 8); p.line(b.x + b.w - 9, b.y + 30, b.x + b.w - 9, b.y + b.h - 8);   // 两边侧墙
        p.line(b.x + 9, b.y + 30, cx - dw, b.y + 30); p.line(cx + dw, b.y + 30, b.x + b.w - 9, b.y + 30);                            // 前墙 + 门洞
        p.fill(C.blue); ink(2.5); p.rect(cx - dw - 5, b.y + 25, 7, 10, 2); p.rect(cx + dw - 2, b.y + 25, 7, 10, 2);
        p.stroke(C.blueD); p.strokeWeight(4); p.line(cx - dw, b.y + 30, cx - dw - 12, b.y + 12);                                          // 开着的门
        p.pop();
      }
      function topPair(u, bt, bd) {
        // 拐弯方向和游戏物理一致：physics.js 里 wingL = -12°（左翅膀压低）平投，滚转往左，落点 z = -2.14（偏左、出不了门）；
        // 两边一样高 z = 0、穿过门。（node -e 直接 require('./src/physics.js') 跑 simulate 得到）所以左板的飞机往左拐、撞左墙
        var fR = cl(u / 0.62), fL = cl(u / 0.8), crashT = 0.8 * bd;
        var shake = bt >= crashT && bt < crashT + 0.2 ? Math.sin(now * 95) * 3 * (1 - (bt - crashT) / 0.2) : 0;
        room(BL, shake); room(BR, 0);
        var y0L = BL.y + BL.h - 26, cxL = BL.x + BL.w / 2;
        var pathL = function (s) { return [cxL - 102 * s * s + Math.sin(s * 15) * 4 * s, y0L - 92 * s]; };
        var y0R = BR.y + BR.h - 26, cxR = BR.x + BR.w / 2, travel = y0R - (BR.y + 30);
        // 轨迹虚线
        p.noFill(); p.stroke('#7aa6ea'); p.strokeWeight(2.4); dash(true);
        p.beginShape(); for (var i = 0; i <= 20; i++) { var q = pathL(fL * i / 20); p.vertex(q[0] + shake, q[1]); } p.endShape();
        p.line(cxR, y0R, cxR, y0R - travel * eio(fR)); dash(false);
        // 左：边摇边拐
        var P = pathL(fL), d = 0.001, Q = pathL(Math.min(1, fL + d)), Q0 = pathL(Math.max(0, fL - d));
        var heading = Math.atan2(Q[0] - Q0[0], Q0[1] - Q[1]);
        if (fL < 1) dart(P[0], P[1], heading, 0.62 + 0.38 * Math.abs(Math.cos(now * 11)));
        else { dart(P[0] + shake + 4, P[1] + 6, heading - 0.5, 0.8); p.stroke(C.red); p.strokeWeight(2.5); for (var j = 0; j < 3; j++) { var a = -2.2 + j * 0.7; p.line(P[0] + 4 + Math.cos(a) * 12, P[1] + Math.sin(a) * 12, P[0] + 4 + Math.cos(a) * 20, P[1] + Math.sin(a) * 20); } }
        // 偏航读数：每变一次轻轻放大一下
        var deg = Math.round(Math.abs(heading) * 180 / Math.PI / 5) * 5;
        if (deg !== st.yaw) { st.yaw = deg; st.yawAt = now; }
        var pop = 1 + 0.25 * Math.max(0, 1 - (now - st.yawAt) / 0.15);
        badge(BL.x + BL.w - 46 + shake, BL.y + 16, '偏了 ' + deg + '°', pop, C.blue);
        badge(BR.x + BR.w - 46, BR.y + 16, '偏了 0°', 1, C.blue);
        // 右：笔直出门
        var yR = y0R - travel * eio(fR);
        if (fR < 1) dart(cxR, yR, 0, 1);
        else dart(cxR, yR - 10 * eo((bt - 0.62 * bd) / 0.25), 0, 1, 1 - eo((bt - 0.62 * bd) / 0.3));
        if (fR >= 1) once('door', 'stamp');
        if (fL >= 1) once('wall', 'wall');
        sticker(cxR, BR.y + 70, '出门啦', C.green, cl((bt - 0.62 * bd) / 0.25), -0.1, 16, 'tick');
        sticker(BL.x + 70 + shake, P[1] + 34, '撞墙', C.red, cl((bt - crashT) / 0.25), 0.12, 16);
      }
      function badge(x, y, s, k, col) {
        p.push(); p.translate(x, y); p.scale(k); p.textSize(13); p.textStyle(p.BOLD);
        var w = p.textWidth(s) + 16; p.fill(col); ink(2.5); p.rect(-w / 2, -11, w, 22, 11);
        p.noStroke(); p.fill(C.white); p.textAlign(p.CENTER, p.CENTER); p.text(s, 0, 0.5); p.pop();
      }
      function lerpBox(a, b, k) { return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, w: a.w + (b.w - a.w) * k, h: a.h + (b.h - a.h) * k }; }

      /* ---------- 每帧 ---------- */
      function frame() {
        now = p.millis() / 1000;
        var c = clock() || { line: -1 };
        var B = MG.beat(CARD, c), beat = B.beat, bt = B.bt;
        var tO = c.line < 0 ? -1 : c.line === 0 && !c.done ? c.t : 99;    // 开演后过了几秒（-1 = 幕还合着）
        if (beat < 3) st.hit = {};
        p.push(); p.scale(p.width / W);
        stage();
        var docX = tO < 0 ? -40 : -40 + 96 * eo(tO / 0.6);
        var mk = eo((tO - 0.1) / 0.5), monX = 690 - 112 * mk, monY = 300 - Math.sin(Math.PI * mk) * 34;
        var dpose = '', mon = { mode: '' };
        if (beat >= 1 && beat <= 4) {
          var slide = beat === 1 ? (1 - back(bt / 0.55)) * 380 : 0, merge = beat === 4 ? eio((bt - 0.45) / 0.45) : 0;
          var bl = lerpBox(BL, BC, merge), br = lerpBox(BR, BC, merge);
          bl.x -= slide; br.x += slide;
          board(bl); if (merge < 1) board(br);
          var labelK = beat === 1 ? cl((bt - 0.3) / 0.25) : 1, labelK2 = beat === 1 ? cl((bt - 0.45) / 0.25) : 1;
          if (merge < 0.35) {
            if (beat <= 2) frontPair(beat, bt, slide);
            if (beat >= 3) topPair(beat === 3 ? B.u : 1, beat === 3 ? bt : 99, beat === 3 ? B.bd : 1);
            sticker(BL.x + 46 - slide, BL.y + 16, '一边低', C.red, labelK, -0.08, 15);
            sticker(BR.x + 46 + slide, BR.y + 16, '一样高', C.green, labelK2, -0.08, 15);
          }
          if (beat === 4) {
            var jk = back((bt - 0.9) / 0.35), ax = eo((bt - 1.2) / 0.4), fl = (bt > 1.6 && bt < 1.85) || (bt > 2.05 && bt < 2.3);
            if (jk > 0) {
              jet(320, 156, 0.95 * jk, fl);
              if (ax > 0) { p.stroke(C.red); p.strokeWeight(2.4); dash(true); p.line(320, 70, 320, 70 + 166 * ax); dash(false); }
            }
            sticker(320, 228, '一模一样', C.blue, cl((bt - 1.7) / 0.25), -0.06, 16);
          }
          dpose = beat === 1 ? (tO < 1.1 ? 'wave' : 'point') : beat === 2 ? 'point'
            : beat === 3 ? (B.u >= 0.8 ? 'sweat' : 'point') : bt < 0.9 ? 'sweat' : 'thumb';
          mon.mode = beat === 3 ? (B.u >= 0.8 ? 'dizzy' : B.u >= 0.62 ? 'cheer' : '') : beat === 4 ? (bt < 0.8 ? 'dizzy' : 'cheer') : '';
        } else if (beat === 5) {
          // 最后一问：小怪兽把一边翼尖轻轻抬高一点；两边方向箭头交替闪、正中一个大问号——不给答案
          board(BC);
          var wk = eo((bt - 0.3) / 0.6), lift = -0.17 * eo((bt - 0.9) / 0.6), cy = 150, L = 92;
          var pk = bt < 0.25 ? 1 : back((bt - 0.2) / 0.35);
          if (bt < 0.25) jet(320, 156, 0.95 * (1 - eo(bt / 0.25)), false);
          else frontPlane(320, cy, L * pk, 0, lift, 0, null);
          var alt = Math.floor(now * 2.2) % 2, ak = eo((bt - 1.2) / 0.3);
          if (ak > 0) {
            arrow(320 - 30 - 64 * ak, cy + 54, 64 * ak, 13, -Math.PI / 2, alt ? C.yellow : C.cream);
            arrow(320 + 30 + 64 * ak, cy + 54, 64 * ak, 13, Math.PI / 2, alt ? C.cream : C.yellow);
            qmark(320, cy + 52, 24, C.red);                     // 「← ？ →」
          }
          var qk = cl((bt - 0.8) / 0.25);
          if (qk > 0) {
            p.push(); p.translate(320, 92 + Math.sin(now * 3) * 2); p.scale(back(qk));
            p.fill(C.red); ink(3.5); p.circle(0, 0, 50); qmark(0, 1, 34, C.white); p.pop();
          }
          monX = 578 - 108 * eio(bt / 0.6); monY = 300;
          var tip = tipOf(320, cy, L * pk, lift, 1, 0);
          mon = bt > 0.6 ? { mode: 'reach', to: [tip[0] + 4, tip[1] + 8] } : { mode: '' };
          dpose = 'think';
        }
        doctor(docX, 300, 6.6, { pose: dpose });
        monster(monX, monY, 6, mon);
        curtain(tO < 0 ? 0 : eio(tO / 0.6));
        banner(tO);
        subtitle(B.text, bt);
        p.pop();
      }
    };
  };

  // 最小的测试 sketch：画一个圆和一行字（格 1 验收用）
  MG.testSketch = function (p) {
    p.setup = function () { p.createCanvas(200, 100); };
    p.draw = function () { p.background(43, 42, 92); p.fill('#f6c933'); p.circle(50, 50, 60); p.fill(255); p.textSize(20); p.text('p5 ' + p.VERSION, 90, 56); };
  };

  root.MG = MG;
})(typeof window !== 'undefined' ? window : globalThis);

(function () {
  var stage = document.getElementById('stage'), msg = document.getElementById('msg'), h = null, t0 = 0;
  if (!window.p5) { msg.textContent = '官方 p5 没加载到，请检查网络'; document.getElementById('again').style.display = 'none'; return; }
  msg.textContent = 'p5 ' + p5.prototype.VERSION;
  // 假时钟：正文 11.4 秒 → 停 0.26 秒 → 提问 5.7 秒 → 停在最后一帧（和游戏里童声时钟同一个格式）
  function clock() {
    var t = (performance.now() - t0) / 1000;
    if (t < 11.4) return { line: 0, t: t, dur: 11.4, done: false };
    t -= 11.66;
    if (t < 0) return { line: 0, t: 11.4, dur: 11.4, done: false };
    if (t < 5.7) return { line: 1, t: t, dur: 5.7, done: false };
    return { line: 1, t: 5.7, dur: 5.7, done: true };
  }
  function play() {
    if (h) h.remove();
    t0 = performance.now();
    h = MG.run(MG.wingSketch(clock), stage, function () { msg.textContent = '小剧场出错了（见控制台）'; });
  }
  document.getElementById('again').onclick = play;
  play();
})();
</script></body></html>
